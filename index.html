<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de campos de formulario - HTML </title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://www.pngall.com/wp-content/uploads/13/Dell-Logo-PNG-Images.png" type="image/png">
</head>

<body>
    <main class="container">
        <header>
            <h1>Campos de formulario no HTML 5</h1>
            <p>
                Exemplo de referencia de inputs para os dev's
            </p>
        </header>
        <form action="#" method="post">
            <fieldset>
                <legend> 1, Entradas de Texto e Dados Gerais.</legend>
                <div class="field-group">
                    <label for="Texto">Texto Simples (txt):</label>
                    <input type="text" id="text" placeholder="Ex: João da Silva">
                </div>
                <div class="field-group">
                    <label for="password">Senha (password):</label>
                    <input type="text" id="password" name="password" placeholder="Digite sua Senha">
                </div>
                <div class="field-group">
                    <label for="email">E-mail (email):</label>
                    <input type="email" id="email" name="email" placeholder="Usuario@dominio.com">
                </div>
                <div class="field-group">
                    <label for="url">URL (site/Website):</label>
                    <input type="url" id="url" name="url" placeholder="https://exemplo.com.br">
                </div>
                <div class="field-group">
                    <label for="tel">Telefone (tel):</label>
                    <input type="tel" id="tel" name="tel" placeholder="+55 (11) 99999-9999">
                </div>
                <div class="field-group">
                    <label for="search">Pesquisa (search):</label>
                    <input type="search" id="search" name="search" placeholder="O que vc procura?">
                </div>
                <div class="field-group">
                    <label for="textarea">Texto Multi-linha (textarea):</label>
                    <textarea id="textarea" name="textarea" rows="4"
                        placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>
            </fieldset>
            <!-- 2. Numeros e Intervalos-->
             <fieldset>
                <legend> 2. Números e Seleção Numerica</legend>
                <div class="field-group">
                    <label for="number">Número (number):</label>
                    <input type="number" id="number" name="number" min="0" max="100" step="1" placeholder="Digite um número">
                </div>
                <div class="field-group">
                    <label for="range">Intervalo (range):</label>
                    <input type="range" id="range" name="range" min="0" max="100" step="1" value="50">
                </div>
             </fieldset>
             <!-- 3. Data e Horario-->
             <fieldset>
                <legend> 3. Data e Horário</legend>
                <div class="field-group">
                    <label for="date">Data (date):</label>
                    <input type="date" id="date" name="date">
                </div>
                <div class="field-group">
                    <label for="time">Horário (time):</label>
                    <input type="time" id="time" name="time">
                </div>
                <div class="field-group">
                    <label for="datetime-local">Data e Horário Local (datetime-local):</label>
                    <input type="datetime-local" id="datetime-local" name="datetime-local">
                </div>
                <div class="field-group">
                    <label for="month">Mês (month):</label>
                    <input type="month" id="month" name="month">
                </div>
                <div class="field-group">
                    <label for="week">Semana (week):</label>
                    <input type="week" id="week" name="week">
                </div>
             </fieldset>
             <!-- 4. Seleção e Opções  -->
                <fieldset>
                    <legend> 4. Seleção e Opções</legend>
                    <div class="field-group">
                        <label for="radio">Caixa de Seleção Unica (radio):</label>
                        <input type="radio" id="radio1" name="radio" value="opcao1"> Masculino
                        <input type="radio" id="radio2" name="radio" value="opcao2"> Feminino
                        <input type="radio" id="radio3" name="radio" value="opcao3"> Outro
                    </div>
                    <div class="field-group">
                        <label for="checkbox">Caixa de Multipla Escolha (checkbox):</label>
                        <input type="checkbox" id="checkbox" name="checkbox" value="opcao1"> HTML
                        <input type="checkbox" id="checkbox" name="checkbox" value="opcao2"> CSS
                        <input type="checkbox" id="checkbox" name="checkbox" value="opcao3"> JavaScript
                    </div>
                    <div class="field-group">
                        <label for="select">lista Suspensa simples (select):</label>
                        <select id="select" name="select">
                            <option value="">Selecione uma opção</option>
                            <option value="opcao1">Opção 1</option>
                            <option value="opcao2">Opção 2</option>
                            <option value="opcao3">Opção 3</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="select-multiple">Lista Suspensa Multipla (select multiple):</label>
                        <select id="select-multiple" name="select-multiple" multiple size="3">
                            <option value="opcao1">Modulo 1</option>
                            <option value="opcao2">Modulo 2</option>
                            <option value="opcao3">Modulo 3</option>
                        </select>
                    </div>
                    <div>
                        <label for="datalist-input">Campo de Autocompletar (datalist):</label>
                        <input list="sugestoes" id="datalist-input" name="datalist" placeholder="Digite algo...">
                        <datalist id="sugestoes">
                            <option value="Python"></option>
                            <option value="Java"></option>
                            <option value="C#"></option>
                            <option value="PHP"></option>
                            <option value="TyperScript"></option>
                        </datalist>
                    </div>
                    </fieldset>
                    <!-- 5. Arquivos cores e outros -->
                    <fieldset>
                        <legend> 5. Arquivos, cores e outros</legend>
                     <div class="field-group">
                        <label for="color">Seleção de Cor (color):</label>
                        <input type="color" id="color" name="color" value="#ff0000">
                     </div>
                     <div class="field-group">
                        <label for="file">Upload de Arquivo (file):</label>
                        <input type="file" id="file" name="file">
                     </div>
                     <div class="field-group">
                        <label for="hidden">Campo Oculto (hidden):</label>
                        <input type="hidden" id="hidden" name="hidden" value="valor_oculto">
                        </div>
                        <div class="field-group">
                            <label for="readonly">Campo de Leitura (readonly):</label>
                            <input type="text" id="readonly" name="readonly" value="Valor somente para leitura" readonly>
                        </div>
                     <div class="field-group">
                        <label for="submit">Botão de Envio (submit):</label>
                        <input type="submit" id="submit" name="submit" value="Enviar">
                     </div>
                </fieldset>
                <!-- 6. Botões -->
                <fieldset>
                    <legend> 6. Botões</legend>
                    <div class="field-group">
                        <label for="button">Botão (button):</label>
                        <input type="button" id="button" name="button" value="Clique Aqui">
                    </div>
                    <div class="field-group">
                        <label for="reset">Botão de Reset (reset):</label>
                        <input type="reset" id="reset" name="reset" value="Limpar Formulário">
                    </div>
                    <div class="field-group">
                        <label for="image">Botão de Imagem (image):</label>
                        <input type="image" id="image" name="image" src="https://www.pngall.com/wp-content/uploads/13/Dell-Logo-PNG-Images.png" alt="Botão de Imagem">
                    </div>
                </fieldset>
            </form>
        </form>
    </main>
</body>
</html>
